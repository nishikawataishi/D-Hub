name: CI

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Flutter テスト・静的解析 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.2"
          cache: true

      # firebase_options.dart は gitignore 対象のため Secret から復元
      - name: firebase_options.dart を復元
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart

      - name: 依存関係の取得
        run: flutter pub get

      - name: 静的解析（エラー・警告のみ失敗、infoは許容）
        run: flutter analyze --no-fatal-infos

      - name: テスト実行
        run: flutter test

  # ── Firestore ルールテスト（エミュレータ） ──
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: firebase-tools インストール
        run: npm install -g firebase-tools

      # npm install ではなく npm ci を使う。
      # npm install は毎回レジストリから解決し直すため、侵害版が公開されている
      # 数時間の窓に当たると引き込んでしまう。npm ci は package-lock.json の
      # 内容そのままを入れるので、ロックファイルを更新しない限り中身が変わらない。
      - name: 依存関係の取得（ロックファイル厳守）
        working-directory: firestore-tests
        run: npm ci

      # Storage も起動する。storage.rules は firestore.rules と別ファイル・別評価で、
      # 片方だけ検証しても もう片方の穴には気づけない（実際に削除まわりで事故済み）。
      - name: ルールテスト実行（Firestore + Storage）
        working-directory: firestore-tests
        run: firebase emulators:exec --only firestore,storage --project demo-rules-test "node --test rules.test.mjs storage.rules.test.mjs"

  # ── Cloud Functions の静的解析 ──
  # 管理者権限で動くサーバコードなのに、これまでCIで一切検査されていなかった。
  # lint スクリプトは Firebase テンプレート由来で元からあったが、設定ファイルが
  # 無く実行するとエラーになる状態だった（2026-08-10に .eslintrc.json を追加）。
  #
  # ルールは eslint:recommended のみ。eslint-config-google も試したが体裁の指摘が
  # 908件（大半が CRLF と空白）出るだけで、本番コードを全面書き換えする割に
  # 不具合検知の利得が無い。recommended は現状のコードで0件なので、
  # 「今後入る未定義変数・未使用変数・到達不能コード」を検知する門番として機能する。
  functions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # rules-test と同じ理由で npm install ではなく npm ci（ロックファイル厳守）
      - name: 依存関係の取得（ロックファイル厳守）
        working-directory: functions
        run: npm ci

      - name: ESLint
        working-directory: functions
        run: npm run lint

  # ── セキュリティチェック ──
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 秘密ファイルは gitignore し、CI で Secret から復元する運用。
      # public リポジトリなので 1 回でもコミットすれば即座に露出し、履歴にも残る。
      # GitHub の secret scanning は「認証情報らしい文字列」しか見ず、設定ファイルや
      # 署名鍵の混入は検知できない（汎用パターン検出は Advanced Security が必要）。
      # そこはカバーされないので、ここで追跡状態を直接見て塞ぐ。
      - name: 秘密ファイルの混入検査
        run: |
          FAILED=0
          for f in lib/firebase_options.dart \
                   android/app/google-services.json \
                   android/key.properties \
                   ios/Runner/GoogleService-Info.plist; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f が Git に追跡されています（gitignore 対象のはず）"
              FAILED=1
            fi
          done
          if git ls-files | grep -iE '\.(jks|keystore|p12|mobileprovision|pem)$'; then
            echo "::error::署名鍵・証明書らしきファイルが追跡されています"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "秘密ファイルの混入なし"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json だけで監査できるので node_modules は入れない。
      #
      # ブロックするのは critical のみ。現状 functions には high 1件 + moderate 11件
      # あるが、いずれも firebase-admin / firebase-functions の推移的依存で、解消には
      # 破壊的変更（firebase-admin 14 系）が要る。high で止めると初回から常時赤になり、
      # 赤が常態化すると誰も見なくなる。段階的な解消は Dependabot に任せ、
      # ここでは即対応が要る critical だけを止める。
      - name: npm audit（functions・critical でブロック）
        working-directory: functions
        run: npm audit --audit-level=critical

      # ブロックしない分、内訳は毎回サマリへ出して見える状態にしておく。
      - name: 脆弱性の内訳をサマリへ出力
        if: always()
        working-directory: functions
        run: |
          SUMMARY="$(npm audit 2>&1 | grep -E 'vulnerabilit' | tail -1 || true)"
          {
            echo "### functions の脆弱性"
            echo "${SUMMARY:-検出なし}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Web ビルド（本番 Hosting に配信されるのはこれ） ──
  # Hosting ターゲット app の公開ディレクトリが build/web なので、
  # 本番に出る成果物は実質これ。ここで作った artifact をそのまま deploy すれば、
  # ローカル環境（日本語パス + OneDrive）の差異が本番に混入しない。
  build-web:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.2"
          cache: true

      # firebase_options.dart は gitignore 対象のため Secret から復元
      - name: firebase_options.dart を復元
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart

      - name: 依存関係の取得
        run: flutter pub get

      - name: Web ビルド
        run: flutter build web --release

      # ビルド済み main.dart.js から世代を判別する手段が無い（Dartのwebビルドは
      # 日本語文字列を原形で持たないため grep が効かない）。どのコミットの成果物かは
      # ここに残す情報だけが頼りになるので、必ずサマリへ出しておく。
      - name: ビルド情報をサマリへ出力
        if: always()
        run: |
          echo "### Web ビルド情報" >> "$GITHUB_STEP_SUMMARY"
          echo "- バージョン名: $(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- コミット: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: build/web をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: d-hub-web
          path: build/web
          retention-days: 14

  # ── Android APK ビルド ──
  build-android:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.2"
          cache: true

      # google-services.json / firebase_options.dart は gitignore 対象のため Secret から復元
      - name: Firebase設定ファイルを復元
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart

      # リリース署名(keystore/key.properties)も gitignore 対象のため Secret から復元
      # Secret が無い場合（例: フォークからのPR）は復元せず、build.gradle.kts が debug 署名へフォールバック
      - name: リリース署名ファイルを復元
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "$ANDROID_KEY_PROPERTIES" | base64 -d > android/key.properties
            echo "リリース署名を復元しました"
          else
            echo "署名Secretが無いため debug 署名にフォールバックします"
          fi

      - name: 依存関係の取得
        run: flutter pub get

      - name: APK ビルド（実機確認用）
        run: flutter build apk --release

      - name: APK をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: d-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: AAB ビルド（Play申請用）
        run: flutter build appbundle --release

      - name: AAB をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: d-hub-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ── iOS ビルド（署名なし・App Store申請の前段検証） ──
  # public リポジトリのため macOS ランナーは無料。Apple Developer 登録前でも
  # 「CocoaPods 解決とコンパイルが通るか」だけを先に確認する目的。
  build-ios:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.2"
          cache: true

      # firebase_options.dart / GoogleService-Info.plist は gitignore 対象のため Secret から復元。
      # plist は Runner ターゲットの Copy Bundle Resources に登録済みなので、
      # 復元しないと「ファイルが無い」でビルドが失敗する。
      - name: Firebase設定ファイルを復元
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLESERVICE_INFO_PLIST: ${{ secrets.GOOGLESERVICE_INFO_PLIST }}
        run: |
          echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          echo "$GOOGLESERVICE_INFO_PLIST" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: 依存関係の取得
        run: flutter pub get

      # Firebase系プラグインが iOS 15.0 以上を要求するため、
      # project.pbxproj の IPHONEOS_DEPLOYMENT_TARGET も 15.0 に揃えてある。
      #
      # ビルド番号(CFBundleVersion)には github.run_number を使う。
      # App Store Connect は同じビルド番号の再アップロードを拒否するため、
      # 単調増加する値を自動で割り当てて番号の付け忘れ・重複を防ぐ。
      # バージョン名(CFBundleShortVersionString)は pubspec.yaml の version から取る。
      - name: iOS ビルド（署名なし）
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: ビルド情報をサマリへ出力
        if: always()
        run: |
          echo "### iOS ビルド情報" >> "$GITHUB_STEP_SUMMARY"
          echo "- バージョン名: $(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ビルド番号: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 生成された Podfile / Podfile.lock を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfiles
          path: |
            ios/Podfile
            ios/Podfile.lock
          retention-days: 14
          if-no-files-found: warn
